<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>സൗണ്ട് ബുക്ക് - വേർഡ് ആപ്പ്</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #eef2f3; margin: 0; text-align: center; }
.container { max-width: 500px; margin: 0 auto; }
h2 { color: #2c3e50; margin-bottom: 15px; }

.word-card {
    background: #fff;
    border-left: 5px solid #2ecc71;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
}

.word-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mal-text { font-size: 18px; font-weight: bold; color: #34495e; }
.arbi-text { font-size: 26px; font-family: 'Traditional Arabic', 'Amiri', sans-serif; color: #27ae60; direction: rtl; }

.action-bar {
    display: flex;
    gap: 10px;
    align-items: center;
}

.btn-play {
    background: #3498db;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
}
.btn-play:hover { background: #2980b9; }

.btn-hw {
    background: #9b59b6;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
}

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    padding: 15px;
}
.modal-content {
    background: white;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    position: relative;
}
.modal-close {
    position: absolute;
    top: 10px; right: 15px;
    font-size: 24px;
    cursor: pointer;
    color: #333;
    font-weight: bold;
}
.canvas-container {
    border: 2px solid #9b59b6;
    background: #fff;
    width: 100%;
    height: 280px;
    margin: 10px 0;
    position: relative;
}
#hwCanvas { width: 100%; height: 100%; }

.loading { font-weight: bold; color: #7f8c8d; margin-top: 30px; }
.no-data { color: #e74c3c; font-weight: bold; margin-top: 30px; }
</style>
</head>
<body>

<div class="container">
    <h2>📖 വേർഡ് ലേണിംഗ് ആപ്പ്</h2>
    <div id="wordsContainer">
        <div class="loading">🔄 ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</div>
    </div>
</div>

<!-- Handwriting View Modal -->
<div id="hwModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeHwModal()">&times;</span>
        <h3 style="color:#9b59b6; margin-top:0;">✍️ ഹാൻഡ്‌റൈറ്റിംഗ് അനിമേഷൻ</h3>
        <div class="canvas-container">
            <svg id="hwCanvas" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
        </div>
        <button class="btn-play" style="width:100%; justify-content:center;" onclick="replayHwAnimation()">▶️ വീണ്ടും അനിമേറ്റ് ചെയ്യുക</button>
    </div>
</div>

<script>
let currentWordList = [];
let currentPathsToDraw = null;

window.onload = function() {
    loadWordData();
};

async function loadWordData() {
    const container = document.getElementById('wordsContainer');
    try {
        // ക്യാഷ് തടയാനും പുതിയ ഡാറ്റ ഉറപ്പാക്കാനും t പാരാമീറ്റർ നൽകുന്നു
        let response = await fetch('data/data.json?t=' + Date.now());
        if(!response.ok) throw new Error("ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല!");

        let data = await response.json();
        if(data && Array.isArray(data.words) && data.words.length > 0) {
            currentWordList = data.words;
            renderWordsList(currentWordList);
        } else {
            container.innerHTML = `<div class="no-data">⚠️ വാക്കുകളൊന്നും ലഭ്യമല്ല. അഡ്മിൻ പാനലിൽ നിന്ന് ഡാറ്റ ചേർക്കുക!</div>`;
        }
    } catch(err) {
        container.innerHTML = `<div class="no-data">❌ പിശക്: ${err.message}</div>`;
    }
}

function renderWordsList(words) {
    const container = document.getElementById('wordsContainer');
    container.innerHTML = '';

    words.forEach((item, index) => {
        let card = document.createElement('div');
        card.className = 'word-card';

        let audioButtonHtml = item.audio ? 
            `<button class="btn-play" onclick="playAudio('${item.audio}')"><i class="fa-solid fa-volume-high"></i> കേൾക്കുക</button>` : '';

        let hwButtonHtml = (item.writingPaths && item.writingPaths.length > 0) ? 
            `<button class="btn-hw" onclick="showHandwriting(${index})"><i class="fa-solid fa-pen-nib"></i> ഹാൻഡ്‌റൈറ്റിംഗ്</button>` : '';

        card.innerHTML = `
            <div class="word-header">
                <span class="mal-text">${item.mal || ''}</span>
                <span class="arbi-text">${item.arbiText || ''}</span>
            </div>
            <div class="action-bar">
                ${audioButtonHtml}
                ${hwButtonHtml}
            </div>
        `;
        container.appendChild(card);
    });
}

function playAudio(src) {
    if(!src) return;
    let audio = new Audio(src + '?t=' + Date.now());
    audio.play().catch(e => alert("ഓഡിയോ പ്ലേ ചെയ്യാൻ കഴിഞ്ഞില്ല!"));
}

function showHandwriting(index) {
    let wordObj = currentWordList[index];
    if(!wordObj || !wordObj.writingPaths) return;

    currentPathsToDraw = wordObj.writingPaths;
    document.getElementById('hwModal').style.display = 'flex';
    replayHwAnimation();
}

function closeHwModal() {
    document.getElementById('hwModal').style.display = 'none';
}

function replayHwAnimation() {
    let canvas = document.getElementById('hwCanvas');
    canvas.innerHTML = '';
    if(!currentPathsToDraw) return;

    currentPathsToDraw.forEach(path => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        for(let i = 0; i < 16; i++) {
            let p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("transform", `translate(${(i-8)*0.4}, ${-(i-8)})`);
            p.setAttribute("stroke", "#e74c3c");
            p.setAttribute("stroke-width", "3");
            p.setAttribute("fill", "none");
            p.setAttribute("stroke-linecap", "round");

            let dStr = `M ${path[0].x} ${path[0].y}`;
            for(let pt = 1; pt < path.length; pt++) {
                dStr += ` L ${path[pt].x} ${path[pt].y}`;
            }
            p.setAttribute("d", dStr);
            g.appendChild(p);
        }
        canvas.appendChild(g);
    });
}
</script>

</body>
</html>
